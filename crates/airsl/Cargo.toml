[package]
name        = "airsl"
description = "Embeddable Lua 5.4 runtime with a capability-gated sandbox and a host standard library"
version.workspace      = true

edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

readme     = "README.md"
keywords   = ["lua", "scripting", "embedded", "sandbox"]
categories = ["development-tools"]

[lints]
workspace = true

[[bench]]
name    = "eval"
harness = false

# Declared only to turn `test = true` on: the example's `#[test]` is the chapter's drift check for a
# host's own module, and the gate runs examples as tests only when asked.
[[example]]
name = "notes-module-setup"
path = "examples/notes-module/setup.rs"
test = true

[dependencies]
mlua       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
regex      = { workspace = true }
globset    = { workspace = true }
walkdir    = { workspace = true }
sha2       = { workspace = true }
sha1       = { workspace = true }
jiff       = { workspace = true }
toml       = { workspace = true }
tempfile   = { workspace = true }
