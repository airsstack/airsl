[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
# Not CARGO_HOME: the prebuilt binary exists for engineers who have no Rust toolchain,
# and a ~/.cargo/bin appearing on such a machine would be a surprise.
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Only `airsl-cli-v*` tags start a release. Each release also tags the library
# (`airsl-v*`), which has no binary, and dist fails its plan step on such a tag.
tag-namespace = "airsl-cli"
# A checksum file can be swapped alongside the binary it describes; an attestation
# ties each archive's digest to this repository, commit and workflow.
github-attestations = true
