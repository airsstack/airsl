#
# cargo-make task graph for the airsl workspace.
#
#   cargo make            # the full Definition-of-Done gate
#   cargo make fmt        # rewrite formatting (the only task that mutates the tree)
#   cargo make clippy     # a single gate step
#   cargo make examples   # run every example end to end
#   cargo make book       # serve the book locally with live reload
#   cargo make --list-all-steps
#
# The five gate steps are the canonical command set for this repository: fmt, clippy,
# rustdoc, tests, doctests, every one of them warnings-as-errors. CI runs
# `cargo make dod`, so the pipeline and a local run are the same command.
#
# Install: cargo install --locked cargo-make
#

[config]
# Every gate command already carries `--workspace`, so the task must run exactly
# once from the workspace root. Without this, cargo-make re-runs each task once
# per member crate — redundant full-workspace builds.
default_to_workspace = false
# No implicit task graph. The gate is only what is written below, and a
# built-in `build`/`test`/`ci-flow` inherited from cargo-make's core set would
# run cargo commands nobody in this repo chose.
skip_core_tasks = true
min_version = "0.37.0"

[env]
CARGO_TERM_COLOR = "always"

# No command below passes `--all-features`: `airsl` forwards mlua's mutually
# exclusive Lua features (`lua54`, `luajit`), so an all-features build is a
# compile error by construction. Coverage is the default build plus the per-ABI
# runs of the native module.

# ---------------------------------------------------------------------------
# The gate
# ---------------------------------------------------------------------------

[tasks.default]
alias = "dod"

[tasks.dod]
category = "Gate"
description = "Definition of Done — every step must exit 0 with zero warnings"
dependencies = ["fmt-check", "clippy", "doc", "test", "test-doc"]

[tasks.fmt-check]
category = "Gate"
description = "Assert formatting without rewriting anything"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.clippy]
category = "Gate"
description = "Lint every target, warnings are errors"
# `--all-targets` covers tests, examples and benches — a lint living only in
# test code passes silently without it. `-D warnings` also promotes plain rustc
# warnings, which is why the gate has no separate `cargo build` step.
command = "cargo"
args = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--",
  "-D",
  "warnings",
]

[tasks.doc]
category = "Gate"
description = "Build rustdoc with warnings promoted to errors"
# Plain `cargo doc` prints rustdoc warnings and still exits 0; RUSTDOCFLAGS is
# the only thing that makes this step a gate rather than a report.
command = "cargo"
args = ["doc", "--workspace", "--no-deps"]

[tasks.doc.env]
RUSTDOCFLAGS = "-D warnings"

[tasks.test]
category = "Gate"
description = "Unit, integration, example and bench targets, plus the prose guards in docs-check"
# The shipped prose is checked here rather than in a task of its own: the guards are ordinary
# tests in `crates/docs-check`, so this one command carries them on every OS in the CI matrix,
# with no shell script to port and no sixth gate step to keep in sync with the guideline's five.
# They read the whole repository, not one crate, so `dod-crate airsl` and `dod-crate airsl-cli`
# do not run them; `dod` and `dod-crate docs-check` do. What they assert is listed in that crate's
# module docs and in CLAUDE.md.
command = "cargo"
args = ["test", "--workspace", "--all-targets"]

[tasks.test-doc]
category = "Gate"
description = "Doctests — excluded by --all-targets, so they need their own run"
command = "cargo"
args = ["test", "--workspace", "--doc"]

# ---------------------------------------------------------------------------
# Examples
# ---------------------------------------------------------------------------

[tasks.examples]
category = "Examples"
description = "Run every example end to end, check the book appendix's output, and compile and test every shipped .lua"
# Deliberately not a dependency of `dod`, for the reason `deny` is not: the
# Definition of Done is five commands, and this is a sixth. It also does things
# the five do not — runs each example with the invoking shell's stdin, runs the
# book appendix's script under each preset, and runs `airsl check` and
# `airsl test` over every shipped `.lua` — so it answers to the invoking shell
# as well as to the working tree.
#
# What each example prints is not compared here. The gate's `docs-check` tests
# run every example and require its README's `## Output` block to equal the
# output exactly, which is the stricter check, and it lives in one place. A
# `docs-check` test also fails if a call to `assert_documented` below names
# anything but the appendix, so the comparison cannot drift back into the
# per-example loop. What this task adds is what the gate does not do: it runs
# each example with the stdin of the invoking shell (the gate's child gets
# none), it runs the book appendix's script under each preset, and it compiles
# and tests every shipped `.lua`.
#
# The appendix half keeps the containment rule. The appendix wraps the output
# in prose and a fence, so equality would not fit, and a looser match than
# containment would pass the very drift it exists to catch. Both sides have
# CRLF folded to LF first: a Windows checkout may convert the line endings of
# the file, and the program's output should not have to know.
#
# Discovery is by directory rather than a hand-kept list: an example that is
# added but not listed would silently never run, which is the failure mode a
# coverage suite can least afford. A platform carve-out is a marker file named
# `unix-only` inside the example's own directory, its text the reason, rather
# than a skip list kept here — a list would recreate the same silent-never-run
# failure one platform at a time. The glob still visits a marked directory, so
# a skip is printed and named rather than the directory simply vanishing from
# the log; a newly added example with no marker runs everywhere and fails
# loudly wherever it cannot, which is the property this whole scheme protects.
# An example marked `no-output` has no README block to compare, and since
# nothing is compared here it needs no special case: it runs like the rest.
script_runner = "@duckscript"
script = '''
# Returns whether `${2}` (what `${1}` printed) appears verbatim in the file
# `${3}`. An empty output fails at once: it would be contained in any file, so
# it would pass while proving nothing. A mismatch echoes the actual output, so
# a failing run shows what to paste rather than only that it differs, and is
# returned rather than raised: the caller counts mismatches and fails once at
# the end, so one run names every transcript that drifted — on a platform only
# CI has, the first mismatch hiding the rest would cost a CI round per example.
function assert_documented
    shown = readfile ${3}
    shown = replace ${shown} "\r\n" "\n"
    actual = replace ${2} "\r\n" "\n"
    if is_empty ${actual}
        trigger_error "${1}: printed nothing, so there is nothing for ${3} to show"
    end
    found = contains ${shown} ${actual}
    if not ${found}
        echo --- actual output of ${1}
        echo ${actual}
        echo --- DRIFT: ${1}: its output does not appear verbatim in ${3}
    end
    return ${found}
end

drifted = set 0

dirs = glob_array crates/airsl/examples/*/
for dir in ${dirs}
    name = basename ${dir}
    # A directory without a `main.rs` is not an example target — cargo
    # ignores it, and so does this.
    main_rs = set ${dir}/main.rs
    has_main = is_file ${main_rs}
    if ${has_main}
        marker = set ${dir}/unix-only
        marked = is_file ${marker}
        on_windows = is_windows
        if ${marked} and ${on_windows}
            reason = readfile ${marker}
            reason = trim ${reason}
            echo --- ${name} SKIPPED on Windows: ${reason}
        else
            echo --- ${name}
            # Capturing the output holds a failing example's stderr back, so
            # it is printed here, before the exit status is judged.
            ran = exec cargo run -q -p airsl --example ${name}
            echo ${ran.stdout}
            if not eq ${ran.code} 0
                echo ${ran.stderr}
                trigger_error "example ${name} exited with status ${ran.code}"
            end
        end
    end
end

# Appendix F's listings are the output of one script under three presets, and
# the script lives in the book as a file so the appendix includes it rather
# than retyping it. Running that file here and requiring each preset's output
# to appear verbatim in the appendix is what keeps the listings true when a
# library function is added or withheld. `pure` starts with no access to
# standard output, so it is given exactly that one grant to be able to print.
probe = set book/src/surfaces.lua
appendix = set book/src/appendix-06-surfaces.md
echo --- appendix F, trusted
ran = exec cargo run -q -p airsl-cli -- run --policy trusted ${probe}
if not eq ${ran.code} 0
    echo ${ran.stderr}
    trigger_error "airsl run --policy trusted ${probe} exited with status ${ran.code}"
end
documented = assert_documented "airsl run --policy trusted" ${ran.stdout} ${appendix}
if not ${documented}
    drifted = calc ${drifted} + 1
end
echo --- appendix F, confined
ran = exec cargo run -q -p airsl-cli -- run --policy confined ${probe}
if not eq ${ran.code} 0
    echo ${ran.stderr}
    trigger_error "airsl run --policy confined ${probe} exited with status ${ran.code}"
end
documented = assert_documented "airsl run --policy confined" ${ran.stdout} ${appendix}
if not ${documented}
    drifted = calc ${drifted} + 1
end
echo --- appendix F, pure
ran = exec cargo run -q -p airsl-cli -- run --policy pure --allow-access stdout ${probe}
if not eq ${ran.code} 0
    echo ${ran.stderr}
    trigger_error "airsl run --policy pure --allow-access stdout ${probe} exited with status ${ran.code}"
end
documented = assert_documented "airsl run --policy pure --allow-access stdout" ${ran.stdout} ${appendix}
if not ${documented}
    drifted = calc ${drifted} + 1
end

if greater_than ${drifted} 0
    trigger_error "${drifted} transcript(s) differ from what the program printed; each is named above with its actual output"
end

# Every shipped script still compiles against the current runtime. `check`
# loads and compiles without running, so this costs a parse and nothing else —
# it still runs over marked directories too, since a Windows-incompatible run
# and a Windows-incompatible parse are different claims.
echo --- airsl check
exec --fail-on-error cargo run -q -p airsl-cli -- check crates/airsl/examples/
# `airsl test` is a documented entry point of the CLI, and until this line it
# was one no gate exercised — a test runner nobody runs is the one piece of a
# toolchain that can rot without anyone noticing. It runs over the whole
# examples tree, markers included, for the same reason `check` does: the
# tree's only test file is portable, so narrowing the scan would buy nothing.
#
# Confined, which is this command's default and holds host access but no fs,
# env or exec grant, so a shipped test file has to run without one — the
# modules and functions that need no such grant are the ones a test can lean
# on here.
echo --- airsl test
exec --fail-on-error cargo run -q -p airsl-cli -- test crates/airsl/examples/
'''

# ---------------------------------------------------------------------------
# Book
# ---------------------------------------------------------------------------

# Both tasks install mdBook on first use rather than failing with a missing
# binary: the book is the one part of this repository a docs-only contributor
# touches, and that contributor should not need to know the tool's name first.
# The output lands in `book/book/`, which is ignored — the published copy is
# built by the Pages workflow, never committed.

[tasks.book]
category = "Book"
description = "Serve the book at http://localhost:3000, rebuilding on every edit"
install_crate = { crate_name = "mdbook", binary = "mdbook", test_arg = "--version", min_version = "0.4.52" }
command = "mdbook"
args = ["serve", "book", "--open"]

[tasks.book-build]
category = "Book"
description = "Build the book once into book/book/, the same build Pages publishes"
install_crate = { crate_name = "mdbook", binary = "mdbook", test_arg = "--version", min_version = "0.4.52" }
command = "mdbook"
args = ["build", "book"]

# ---------------------------------------------------------------------------
# Supply chain
# ---------------------------------------------------------------------------

[tasks.deny]
category = "Supply chain"
description = "cargo-deny: security advisories, licenses, duplicate versions, sources"
# Deliberately not a dependency of `dod`. The Definition of Done is the five
# commands the guideline skill owns; adding a sixth here would make this file
# disagree with its source of truth. This check also answers to a moving
# advisory database rather than to the working tree, so it can fail on a commit
# that changed nothing.
command = "cargo"
args = ["deny", "check"]

# ---------------------------------------------------------------------------
# Release
# ---------------------------------------------------------------------------

[tasks.publish-dry-run]
category = "Release"
description = "Validate both crates against what crates.io enforces, publishing nothing"
# `airsl` gets the full dry run; `airsl-cli` gets the file list only, and the
# asymmetry is forced rather than chosen. A dry-run publish resolves every
# dependency against the real index, and `airsl-cli` depends on the `airsl`
# version this same commit is releasing — which is not on crates.io until the
# first half of the release actually goes out. Running it here would therefore
# fail on every release, reporting the publishing order rather than a defect.
# `cargo package --list` stops short of resolution and still reports what the
# rest of this task is for: metadata, keyword count, category slugs, and exactly
# which files land in the archive.
#
# A release is cut from unix, so a Windows run of this task would only prove
# that `cargo package`/`cargo publish` work on a platform that never runs them
# for real — not a goal this workspace has taken on. `windows_alias` redirects
# to a task that says so and exits clean, rather than leaving the task
# unported.
windows_alias = "publish-dry-run-unsupported"
script_runner = "@shell"
script = '''
set -x
cargo package --list -p airsl
cargo publish --dry-run -p airsl
cargo package --list -p airsl-cli
'''

[tasks.publish-dry-run-unsupported]
category = "Release"
description = "Windows stand-in for publish-dry-run: explains the skip and exits clean"
script_runner = "@duckscript"
script = '''
echo "publish-dry-run is skipped on Windows: releases are cut from unix, so this task is not ported here. Run it on macOS or Linux."
'''

# ---------------------------------------------------------------------------
# Development helpers
# ---------------------------------------------------------------------------

[tasks.install]
category = "Development"
description = "Install the airsl binary from this checkout"
command = "cargo"
args = ["install", "--path", "crates/airsl-cli", "--locked", "--force"]

[tasks.fmt]
category = "Development"
description = "Rewrite formatting in place"
command = "cargo"
args = ["fmt", "--all"]

[tasks.clippy-fix]
category = "Development"
description = "Apply the clippy suggestions that are machine-applicable"
command = "cargo"
args = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--fix",
  "--allow-dirty",
]

[tasks.dod-crate]
category = "Development"
description = "The gate scoped to one crate: cargo make dod-crate airsl"
# While developing a single-crate change, `-p <crate>` replaces `--workspace`.
# Cross-crate changes and pre-release runs use the unscoped `dod`. The prose
# guards live in the `docs-check` crate, so only `dod` and
# `dod-crate docs-check` run them.
#
# `airsl-cli` ships no `[lib]` target — every public item lives in `airsl` —
# so `cargo test -p airsl-cli --doc` has nothing to doctest and fails outright
# rather than reporting zero, unlike `cargo test --workspace --doc`, which
# skips a bin-only member instead of erroring on it. The doctest step below
# detects a missing library target and skips just that step, naming why,
# rather than reproducing the failure or dropping the step for every crate:
# `airsl` has doctests and they still run.
#
# The detection is a path convention — `crates/<crate>/src/lib.rs` exists —
# not a query against `cargo metadata`, which would be the precise answer and
# would also catch a `[lib] path = ...` override no member declares today.
# Duckscript, this task's script runner, carries no JSON parser, and a shell
# pipeline through `jq` to read `cargo metadata` would depend on a tool this
# workspace does not otherwise require on every platform `dod-crate` runs on.
# The convention holds for every crate here as of this writing; a member that
# ever overrides its library path would silently lose this step rather than
# fail it, and this check would need rewriting against `cargo metadata` to
# catch that.
script_runner = "@duckscript"
script = '''
crate = set ${1}
if is_empty ${crate}
    trigger_error "usage: cargo make dod-crate <crate-name>"
end
exec --fail-on-error cargo fmt -p ${crate} -- --check
exec --fail-on-error cargo clippy -p ${crate} --all-targets -- -D warnings
# RUSTDOCFLAGS is set on the environment for this one step and cleared right
# after — it must not leak into the two `cargo test` steps below, which never
# wanted it.
set_env RUSTDOCFLAGS "-D warnings"
exec --fail-on-error cargo doc -p ${crate} --no-deps
unset_env RUSTDOCFLAGS
exec --fail-on-error cargo test -p ${crate} --all-targets
lib_path = set crates/${crate}/src/lib.rs
has_lib = is_file ${lib_path}
if ${has_lib}
    exec --fail-on-error cargo test -p ${crate} --doc
else
    echo "doctest step skipped: ${crate} has no library target (no ${lib_path})"
end
'''
