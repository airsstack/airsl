name: Smoke

# Runs every archive a release is about to publish, on the platform it was built for.
#
# Not triggered on its own: airsl-cli-release.yml calls it through dist's
# `global-artifacts-jobs` hook, after every archive is built and before the
# GitHub Release exists. dist makes `host` wait for this workflow to succeed, so
# an archive that fails here is never published — and on a pull request in
# `pr-run-mode = "upload"` the same checks run against the PR's own builds.
#
# This file is written by hand, unlike the release workflow, so `dist generate`
# never touches it.
on:
  workflow_call:
    inputs:
      plan:
        description: The dist manifest the release's plan step produced
        required: true
        type: string

permissions:
  contents: read

jobs:
  targets:
    name: Match archives to runners
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.match.outputs.matrix }}
      version: ${{ steps.match.outputs.version }}
    steps:
      # The matrix is derived from the plan, not written out, so the coverage
      # promise holds by construction: every archive the release will publish
      # gets a smoke job, and a target added to dist-workspace.toml without a
      # runner below fails here instead of shipping untested.
      #
      # musl archives run inside Alpine, which has no glibc at all, so a musl
      # binary that passes there is static rather than merely built for musl.
      - name: Match every archive in the plan to a runner
        id: match
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          runners='{
            "aarch64-apple-darwin":       {"runner": "macos-14"},
            "x86_64-apple-darwin":        {"runner": "macos-15-intel"},
            "x86_64-unknown-linux-gnu":   {"runner": "ubuntu-22.04"},
            "aarch64-unknown-linux-gnu":  {"runner": "ubuntu-22.04-arm"},
            "x86_64-unknown-linux-musl":  {"runner": "ubuntu-22.04",     "alpine": true},
            "aarch64-unknown-linux-musl": {"runner": "ubuntu-22.04-arm", "alpine": true},
            "x86_64-pc-windows-msvc":     {"runner": "windows-2022"}
          }'
          matrix=$(jq -c --argjson runners "$runners" '
            [.artifacts[]
             | select(.kind == "executable-zip")
             | {archive: .name, target: .target_triples[0], alpine: false}
               + ($runners[.target_triples[0]] // {})]' <<<"$PLAN")

          if [ "$(jq length <<<"$matrix")" -eq 0 ]; then
            echo "::error::the plan lists no archives to smoke-test"
            exit 1
          fi
          missing=$(jq -r '.[] | select(.runner == null) | .target' <<<"$matrix")
          if [ -n "$missing" ]; then
            echo "::error::no smoke runner for: $(echo $missing)"
            exit 1
          fi

          jq . <<<"$matrix"
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.releases[0].app_version' <<<"$PLAN")" >> "$GITHUB_OUTPUT"

  smoke:
    name: ${{ matrix.target }}
    needs: targets
    # One broken platform should not hide whether the others work.
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      ARCHIVE: ${{ matrix.archive }}
      VERSION: ${{ needs.targets.outputs.version }}
    steps:
      # The checkout supplies the Lua scripts the checks run, not a build: the
      # binary under test is the downloaded archive.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The same workflow artifacts `host` uploads to the Release, so the bytes
      # tested are the bytes published.
      - name: Fetch the built archives
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-build-local-*
          path: .smoke/artifacts
          merge-multiple: true

      - name: Archive matches its checksum
        working-directory: .smoke/artifacts
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "$ARCHIVE.sha256"
          else
            shasum -a 256 -c "$ARCHIVE.sha256"
          fi

      # Everything under test lives inside the workspace, which the Alpine
      # container mounts at the same path, so one absolute path names the binary
      # and the scripts both inside and outside it.
      - name: Unpack, and point AIRSL at the binary
        env:
          ALPINE: ${{ matrix.alpine }}
        run: |
          mkdir -p .smoke/unpacked
          case "$ARCHIVE" in
            *.zip)    pwsh -NoProfile -Command "Expand-Archive -Path '.smoke/artifacts/$ARCHIVE' -DestinationPath '.smoke/unpacked'" ;;
            *.tar.xz) tar -xJf ".smoke/artifacts/$ARCHIVE" -C .smoke/unpacked ;;
            *)        echo "::error::unknown archive format: $ARCHIVE"; exit 1 ;;
          esac
          bin=$(find "$PWD/.smoke/unpacked" -type f \( -name airsl -o -name airsl.exe \) | head -n 1)
          if [ -z "$bin" ]; then
            echo "::error::no airsl binary inside $ARCHIVE"
            exit 1
          fi

          if [ "$ALPINE" = "true" ]; then
            wrapper="$PWD/.smoke/airsl-in-alpine"
            printf '#!/bin/sh\nexec docker run --rm -v "%s:%s" -w "$PWD" alpine:3.20 "%s" "$@"\n' \
              "$PWD" "$PWD" "$bin" > "$wrapper"
            chmod +x "$wrapper"
            echo "AIRSL=$wrapper" >> "$GITHUB_ENV"
          else
            echo "AIRSL=$bin" >> "$GITHUB_ENV"
          fi

      # A hosted Windows image ships the Visual C++ runtime, so running the
      # binary there cannot show it was not needed. The import table can: dist
      # links the CRT statically by default, and this is where that default is
      # held to account.
      - name: Imports no Visual C++ runtime DLL
        if: runner.os == 'Windows'
        run: |
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          dumpbin=$("$vswhere" -latest -find 'VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe' | head -n 1 | tr -d '\r')
          imports=$("$dumpbin" -nologo -dependents "$AIRSL")
          echo "$imports"
          if grep -iE 'vcruntime|msvcp|ucrtbase|api-ms-win-crt' <<<"$imports"; then
            echo "::error::airsl.exe imports the C runtime dynamically"
            exit 1
          fi

      - name: Reports the version being released
        run: |
          got=$("$AIRSL" --version)
          if [ "$got" != "airsl $VERSION" ]; then
            echo "::error::airsl --version printed '$got', expected 'airsl $VERSION'"
            exit 1
          fi
          echo "$got"

      - name: doctor
        run: |
          "$AIRSL" doctor
          "$AIRSL" doctor --policy confined

      # Every example script, compiled by the shipped binary's own Lua.
      - name: Every example compiles
        run: '"$AIRSL" check crates/airsl/examples'

      # Regex, glob, hash, path, time and json, exercised through the vendored
      # Lua and the host modules exactly as a user's script reaches them.
      - name: The text-toolkit tests pass
        run: '"$AIRSL" test crates/airsl/examples/text-toolkit'

      # A granted read works and six ungranted calls are refused — enforcement,
      # not only presence, in the binary that ships.
      - name: The sandbox refuses what was not granted
        run: |
          mkdir -p .smoke/granted
          printf 'visible\n' > .smoke/granted/visible.txt
          "$AIRSL" run --allow-read .smoke/granted crates/airsl/examples/denials-are-data/denials.lua .smoke/granted
