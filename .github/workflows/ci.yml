name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref supersedes whatever is still running for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are dead weight in a fresh runner and only bloat the cache.
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1

jobs:
  dod:
    name: Definition of Done
    # The matrix is the point: `mlua` is vendored, so every job here compiles Lua 5.4
    # from C. A platform-specific break in that build — or in the host modules that
    # touch paths, processes and time — is invisible on a single runner.
    #
    # Unix only, deliberately. `lib.rs` refuses to build off unix and says why; adding
    # windows-latest back here without doing that work first only re-reports it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # `rustup show` resolves the override in rust-toolchain.toml and installs it.
      # The versions printed below are the record of which toolchain the gate ran on.
      - name: Install the pinned Rust toolchain
        run: |
          rustup show
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate-${{ matrix.os }}

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      # One command, the same one a developer runs locally: fmt-check, clippy,
      # rustdoc, tests, doctests — each with warnings as errors.
      - name: cargo make dod
        run: cargo make dod

      # A step in this job rather than a job of its own — unlike `deny`, which
      # compiles nothing and is free to isolate. The examples link the whole
      # workspace, so running them where the target dir is already warm costs
      # seconds instead of a second full build.
      #
      # The gate above only compiles the examples. This runs them, which is
      # what makes them a check on the runtime rather than on the type checker.
      - name: cargo make examples
        run: cargo make examples

  deny:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Independent of the gate: this reads Cargo.lock and the advisory database,
    # compiles nothing, and finishes in seconds, so it should not wait behind a
    # build to report a licence or advisory problem.
    steps:
      - uses: actions/checkout@v5

      # cargo-deny shells out to `cargo metadata`, and `cargo` here is a rustup
      # shim that resolves rust-toolchain.toml, so the pinned toolchain gets
      # fetched either way. Doing it in its own step keeps that cost out of the
      # check's log.
      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Advisories, licences, duplicate versions and source registries. Policy
      # and every suppression live in deny.toml.
      - name: cargo deny check
        run: cargo deny check
