[toolchain]
# Pinned to a minor channel rather than an exact patch. The airsstack workspace this
# crate was extracted from pins an exact patch because `trybuild` fixtures there assert
# verbatim rustc diagnostics; nothing in this repository does, so a patch release that
# merely rewords a diagnostic must not turn the gate red.
#
# The channel matches `rust-version` in the workspace manifest, so the MSRV claim is
# exercised by every ordinary build rather than asserted and never checked.
channel    = "1.94"
components = ["rustfmt", "clippy"]
profile    = "minimal"
